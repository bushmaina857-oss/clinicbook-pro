<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicBook Pro — Find a Clinic</title>
<style>
  :root {
    --teal-deep: #0F6B66;
    --teal-ink: #0B4F4B;
    --mint-bg: #F3F8F7;
    --coral: #E8735C;
    --coral-dark: #D45D45;
    --ink: #1A2421;
    --ink-soft: #5B6D69;
    --border: #DEE8E6;
    --white: #FFFFFF;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--mint-bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }

  a { text-decoration: none; color: inherit; }

  /* Header */
  header {
    background: var(--teal-deep);
    color: var(--white);
    padding: 18px 20px;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 34px; height: 34px;
    background: var(--coral);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    flex-shrink: 0;
  }
  .logo-text { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }

  /* Hero */
  .hero {
    background: var(--teal-deep);
    color: var(--white);
    padding: 40px 20px 56px;
    text-align: center;
  }
  .hero-inner { max-width: 640px; margin: 0 auto; }
  .hero h1 {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 500;
    margin-bottom: 10px;
    line-height: 1.25;
  }
  .hero p {
    font-size: 15px;
    color: #CFE7E4;
    margin-bottom: 26px;
  }

  .search-box {
    background: var(--white);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(11, 79, 75, 0.25);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    min-width: 0;
  }
  .search-box input::placeholder { color: #9AA9A6; }

  /* Content */
  main {
    max-width: 960px;
    margin: -30px auto 0;
    padding: 0 20px 60px;
    position: relative;
  }

  .section-label {
    color: var(--ink-soft);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 34px 0 14px;
    font-weight: 600;
  }

  .org-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .org-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
  }
  .org-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(15, 107, 102, 0.12);
    border-color: var(--teal-deep);
  }
  .org-card:focus-visible {
    outline: 2px solid var(--teal-deep);
    outline-offset: 2px;
  }

  .org-top { display: flex; align-items: center; gap: 12px; }

  .org-photo {
    width: 52px; height: 52px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--teal-deep);
  }
  .org-initials {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--teal-deep), var(--teal-ink));
    color: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: 17px;
    flex-shrink: 0;
  }

  .org-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    font-family: Georgia, serif;
  }
  .org-address {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .org-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .today-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--teal-deep);
    font-weight: 600;
  }
  .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2FAE8A;
    position: relative;
    flex-shrink: 0;
  }
  .pulse-dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: #2FAE8A;
    opacity: 0.35;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.4; }
    100% { transform: scale(2); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot::after { animation: none; }
  }

  .view-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--coral-dark);
  }

  /* Empty / loading / error states */
  .state-box {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
  }
  .state-box h3 {
    color: var(--ink);
    font-size: 17px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .state-box p { font-size: 14px; }

  .skeleton {
    background: linear-gradient(90deg, #E9F1EF 25%, #F3F8F7 50%, #E9F1EF 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: var(--radius);
    height: 130px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  footer {
    text-align: center;
    padding: 24px 20px 40px;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-mark">CB</div>
    <div class="logo-text">ClinicBook Pro</div> 
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <h1>Find a clinic and book your visit</h1>
    <p>Search clinics near you and reserve your spot in the queue — no phone call needed.</p>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search by clinic name or area..." autocomplete="off">
    </div>
  </div>
</div>

<main>
  <div class="section-label" id="resultsLabel">Clinics</div>
  <div id="orgGrid" class="org-grid"></div>
</main>

<footer>ClinicBook Pro</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Supabase config: use the same project URL / anon key as your other ClinicBook Pro pages ---
  const SUPABASE_URL = 'https://iyxumauddvmdfbukrzaa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eHVtYXVkZHZtZGZidWtyemFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDk5MTUsImV4cCI6MjA5ODIyNTkxNX0.5B2LHcgRdrRrJbrjKWbK-kqUUlHnws7nxl1fNeZrvHE';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const orgGrid = document.getElementById("orgGrid");
  const resultsLabel = document.getElementById("resultsLabel");
  const searchInput = document.getElementById("searchInput");

  let allOrgs = [];

  function getInitials(name) {
    return name
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join("");
  }

  function renderSkeletons(count = 6) {
    orgGrid.innerHTML = Array.from({ length: count })
      .map(() => `<div class="skeleton"></div>`)
      .join("");
  }

  function renderEmpty(message, sub) {
    orgGrid.innerHTML = `
      <div class="state-box" style="grid-column: 1 / -1;">
        <h3>${message}</h3>
        <p>${sub}</p>
      </div>`;
  }

  function renderOrgs(orgs) {
    if (!orgs.length) {
      renderEmpty("No clinics found", "Try a different search term.");
      return;
    }

    orgGrid.innerHTML = orgs.map(org => {
      const photo = org.photo_url
        ? `<img class="org-photo" src="${org.photo_url}" alt="${org.name}">`
        : `<div class="org-initials">${getInitials(org.name)}</div>`;

      return `
        <a class="org-card" href="org.html?id=${org.id}" tabindex="0">
          <div class="org-top">
            ${photo}
            <div>
              <div class="org-name">${org.name}</div>
              ${org.address ? `<div class="org-address">${org.address}</div>` : ""}
            </div>
          </div>
          <div class="org-footer">
            <div class="today-badge">
              <span class="pulse-dot"></span>
              Open for booking
            </div>
            <span class="view-link">View clinic →</span>
          </div>
        </a>`;
    }).join("");
  }

  async function loadOrgs() {
    renderSkeletons();
    try {
      const { data, error } = await supabase
        .from("organizations")
        .select("id, name, address, photo_url")
        .order("name", { ascending: true });

      if (error) throw error;

      allOrgs = data || [];
      resultsLabel.textContent = `${allOrgs.length} clinic${allOrgs.length === 1 ? "" : "s"}`;
      renderOrgs(allOrgs);
    } catch (err) {
      console.error(err);
      renderEmpty("Couldn't load clinics", "Please check your connection and try again.");
    }
  }

  searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      resultsLabel.textContent = `${allOrgs.length} clinic${allOrgs.length === 1 ? "" : "s"}`;
      renderOrgs(allOrgs);
      return;
    }
    const filtered = allOrgs.filter(o =>
      o.name.toLowerCase().includes(q) ||
      (o.address && o.address.toLowerCase().includes(q))
    );
    resultsLabel.textContent = `${filtered.length} result${filtered.length === 1 ? "" : "s"}`;
    renderOrgs(filtered);
  });

  loadOrgs();
</script>

</body>
</html>
