<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — ClinicBook Pro</title>
<style>
  :root {
    --teal-deep: #0F6B66;
    --teal-ink: #0B4F4B;
    --mint-bg: #F3F8F7;
    --coral: #E8735C;
    --coral-dark: #D45D45;
    --ink: #1A2421;
    --ink-soft: #5B6D69;
    --border: #DEE8E6;
    --white: #FFFFFF;
    --radius: 14px;
    --green: #2FAE8A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--mint-bg);
    color: var(--ink);
    line-height: 1.5;
  }
  a { text-decoration: none; color: inherit; }

  /* Shared nav — mirrors across all receptionist screens */
  nav {
    background: var(--teal-deep);
    padding: 0 20px;
  }
  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-logo {
    color: var(--white);
    font-weight: 600;
    font-size: 15px;
    padding: 14px 16px 14px 0;
    margin-right: 8px;
  }
  .nav-tab {
    color: rgba(255,255,255,0.75);
    font-size: 13.5px;
    font-weight: 600;
    padding: 16px 14px;
    border-bottom: 2px solid transparent;
  }
  .nav-tab.active {
    color: var(--white);
    border-bottom-color: var(--coral);
  }
  .nav-tab:hover { color: var(--white); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    height: calc(100vh - 52px);
  }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; height: auto; }
  }

  /* Conversation list */
  .convo-list {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-y: auto;
  }
  .convo-list-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .filter-select {
    font-size: 12.5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--ink);
    background: var(--white);
  }

  .convo-item {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    transition: background 0.12s ease;
  }
  .convo-item:hover { background: var(--mint-bg); }
  .convo-item.selected { background: #E8F3F2; }
  .convo-avatar {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal-deep), var(--teal-ink));
    color: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
  }
  .convo-info { flex: 1; min-width: 0; }
  .convo-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .convo-name { font-size: 14px; font-weight: 600; color: var(--ink); }
  .convo-time { font-size: 11px; color: var(--ink-soft); flex-shrink: 0; }
  .convo-preview {
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .unread-badge {
    background: var(--coral);
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    border-radius: 10px;
    padding: 1px 7px;
    margin-top: 4px;
    display: inline-block;
  }

  /* Conversation thread */
  .thread-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .thread-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .thread-header-info { display: flex; align-items: center; gap: 12px; }
  .thread-name { font-size: 15.5px; font-weight: 600; }
  .thread-phone { font-size: 12.5px; color: var(--ink-soft); }

  .thread-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row { display: flex; }
  .msg-row.from-patient { justify-content: flex-start; }
  .msg-row.from-ai { justify-content: flex-end; }
  .msg-bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
  }
  .from-patient .msg-bubble {
    background: var(--mint-bg);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .from-ai .msg-bubble {
    background: var(--teal-deep);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }

  .thread-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  /* Takeover / reply bar */
  .reply-bar {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .reply-bar input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .reply-bar input:focus { border-color: var(--teal-deep); }
  .send-btn, .takeover-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn { background: var(--coral); color: var(--white); }
  .send-btn:hover { background: var(--coral-dark); }
  .takeover-btn { background: var(--mint-bg); color: var(--teal-deep); border: 1px solid var(--border); }
  .takeover-btn:hover { border-color: var(--teal-deep); }
  .takeover-btn.active { background: var(--green); color: var(--white); border-color: var(--green); }

  .escalation-banner {
    background: #FDF1EF;
    border-bottom: 1px solid #F3D4CC;
    color: #C0392B;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    display: none;
  }
  .escalation-banner.show { display: block; }

  .empty-state {
    padding: 50px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">ClinicBook Pro</div>
    <a class="nav-tab" href="today.html">Today</a>
    <a class="nav-tab" href="book-patient.html">Book Patient</a>
    <a class="nav-tab" href="find-patient.html">Find Patient</a>
    <a class="nav-tab active" href="inbox.html">Inbox</a>
  </div>
</nav>

<main>
  <div class="convo-list">
    <div class="convo-list-header">
      <span id="convoCountLabel">Conversations</span>
      <select class="filter-select" id="filterSelect">
        <option value="mine">Assigned to me</option>
        <option value="all">All conversations</option>
        <option value="unread">Unread only</option>
      </select>
    </div>
    <div id="convoListItems"></div>
  </div>

  <div class="thread-panel">
    <div class="escalation-banner" id="escalationBanner"></div>
    <div id="threadHeader"></div>
    <div id="threadBody" class="thread-empty">Select a conversation to view messages</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Supabase config: use the same project URL / anon key as your other ClinicBook Pro pages ---
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const convoListItems = document.getElementById("convoListItems");
  const convoCountLabel = document.getElementById("convoCountLabel");
  const threadHeader = document.getElementById("threadHeader");
  const threadBody = document.getElementById("threadBody");
  const escalationBanner = document.getElementById("escalationBanner");
  const filterSelect = document.getElementById("filterSelect");

  let currentStaff = null; // { id, org_id, role }
  let conversations = [];
  let selectedConvo = null;
  let takeoverActive = false;

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    if (diff < 60) return "now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
    return `${Math.floor(diff / 86400)}d`;
  }

  function getInitials(name) {
    return (name || "?")
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join("");
  }

  async function loadCurrentStaff() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return null;
    const { data } = await supabase
      .from("staff")
      .select("id, org_id, role, full_name")
      .eq("user_id", user.id)
      .single();
    return data;
  }

  async function loadConversations() {
    let query = supabase
      .from("whatsapp_conversations")
      .select("id, patient_name, patient_phone, assigned_staff_id, last_message_at, unread_count, messages")
      .eq("org_id", currentStaff.org_id)
      .order("last_message_at", { ascending: false });

    const filter = filterSelect.value;
    if (filter === "mine") query = query.eq("assigned_staff_id", currentStaff.id);
    if (filter === "unread") query = query.gt("unread_count", 0);

    const { data, error } = await query;
    if (error) {
      console.error(error);
      return;
    }
    conversations = data || [];
    renderConvoList();
  }

  function renderConvoList() {
    convoCountLabel.textContent = `${conversations.length} conversation${conversations.length === 1 ? "" : "s"}`;

    if (!conversations.length) {
      convoListItems.innerHTML = `<div class="empty-state">No conversations yet.</div>`;
      return;
    }

    convoListItems.innerHTML = conversations.map(c => {
      const lastMsg = (c.messages || []).slice(-1)[0];
      const preview = lastMsg
        ? (typeof lastMsg.content === "string" ? lastMsg.content : "[action taken]")
        : "No messages yet";

      return `
        <div class="convo-item ${selectedConvo && selectedConvo.id === c.id ? "selected" : ""}" data-id="${c.id}">
          <div class="convo-avatar">${getInitials(c.patient_name)}</div>
          <div class="convo-info">
            <div class="convo-top-row">
              <span class="convo-name">${c.patient_name || c.patient_phone}</span>
              <span class="convo-time">${timeAgo(c.last_message_at)}</span>
            </div>
            <div class="convo-preview">${preview}</div>
            ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ""}
          </div>
        </div>`;
    }).join("");

    document.querySelectorAll(".convo-item").forEach(item => {
      item.addEventListener("click", () => {
        const convo = conversations.find(c => String(c.id) === item.dataset.id);
        openConversation(convo);
      });
    });
  }

  async function openConversation(convo) {
    selectedConvo = convo;
    takeoverActive = false;
    renderConvoList();
    renderThread();

    // mark as read
    if (convo.unread_count > 0) {
      await supabase.from("whatsapp_conversations").update({ unread_count: 0 }).eq("id", convo.id);
      convo.unread_count = 0;
    }
  }

  function renderThread() {
    if (!selectedConvo) {
      threadHeader.innerHTML = "";
      threadBody.className = "thread-empty";
      threadBody.innerHTML = "Select a conversation to view messages";
      escalationBanner.classList.remove("show");
      return;
    }

    threadHeader.innerHTML = `
      <div class="thread-header">
        <div class="thread-header-info">
          <div class="convo-avatar">${getInitials(selectedConvo.patient_name)}</div>
          <div>
            <div class="thread-name">${selectedConvo.patient_name || "Unknown patient"}</div>
            <div class="thread-phone">${selectedConvo.patient_phone}</div>
          </div>
        </div>
        <button class="takeover-btn ${takeoverActive ? "active" : ""}" id="takeoverBtn">
          ${takeoverActive ? "AI paused — you're replying" : "Take over conversation"}
        </button>
      </div>`;

    const msgs = (selectedConvo.messages || []).filter(m => typeof m.content === "string" || Array.isArray(m.content) === false);

    threadBody.className = "thread-messages";
    threadBody.innerHTML = (msgs.length ? msgs.map(m => {
      const isPatient = m.role === "user";
      const text = typeof m.content === "string" ? m.content : "[action taken]";
      return `
        <div class="msg-row ${isPatient ? "from-patient" : "from-ai"}">
          <div class="msg-bubble">${text}</div>
        </div>`;
    }).join("") : `<div class="thread-empty">No messages yet</div>`) + `
      <div class="reply-bar" style="border-top: none; padding-top: 14px;">
        <input type="text" id="replyInput" placeholder="${takeoverActive ? 'Type your reply to the patient...' : 'Take over to reply directly'}" ${takeoverActive ? "" : "disabled"}>
        <button class="send-btn" id="sendBtn" ${takeoverActive ? "" : "disabled"}>Send</button>
      </div>`;

    threadBody.scrollTop = threadBody.scrollHeight;

    document.getElementById("takeoverBtn").addEventListener("click", toggleTakeover);
    const sendBtn = document.getElementById("sendBtn");
    if (sendBtn) sendBtn.addEventListener("click", sendManualReply);
  }

  async function toggleTakeover() {
    takeoverActive = !takeoverActive;
    // Persist takeover state so the AI webhook knows to stay silent on this thread
    await supabase
      .from("whatsapp_conversations")
      .update({ assigned_staff_id: currentStaff.id, ai_paused: takeoverActive })
      .eq("id", selectedConvo.id);
    renderThread();
  }

  async function sendManualReply() {
    const input = document.getElementById("replyInput");
    const text = input.value.trim();
    if (!text) return;

    // NOTE: sending the actual WhatsApp message requires calling your
    // whatsapp-webhook Edge Function (or a dedicated send-message function)
    // since the Meta access token must stay server-side, not in this page.
    const { error } = await supabase.functions.invoke("send-staff-reply", {
      body: { conversation_id: selectedConvo.id, text, staff_id: currentStaff.id },
    });

    if (error) {
      alert("Couldn't send message. Please try again.");
      return;
    }

    selectedConvo.messages = [...(selectedConvo.messages || []), { role: "assistant", content: text }];
    input.value = "";
    renderThread();
  }

  async function init() {
    currentStaff = await loadCurrentStaff();
    if (!currentStaff) {
      convoListItems.innerHTML = `<div class="empty-state">Please log in to view the inbox.</div>`;
      return;
    }
    filterSelect.value = "mine";
    await loadConversations();

    filterSelect.addEventListener("change", loadConversations);

    // Live updates
    supabase
      .channel("whatsapp_conversations_changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "whatsapp_conversations" }, () => {
        loadConversations();
      })
      .subscribe();
  }

  init();
</script>

</body>
</html>
