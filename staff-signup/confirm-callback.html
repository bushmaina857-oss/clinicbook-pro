<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClinicBook Pro — Confirming...</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F9FB; --white: #fff; --navy: #0D1B2A;
      --teal: #0A7EA4; --teal-light: #E6F4F9;
      --text: #1A2636; --muted: #6B7A8D;
      --border: #DDE3EA; --radius: 14px;
      --card-shadow: 0 2px 12px rgba(13,27,42,0.07);
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--navy); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0,0,0,0.25); padding: 32px 28px;
      width: 100%; max-width: 400px; text-align: center;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--navy); margin-bottom: 20px; }
    .logo span { color: var(--teal); }

    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .status-text { font-size: 13px; color: var(--muted); line-height: 1.6; }

    .success-icon { font-size: 40px; margin-bottom: 14px; }
    .error-icon { font-size: 40px; margin-bottom: 14px; }

    .action-btn {
      display: inline-block; margin-top: 20px; padding: 12px 24px;
      border-radius: 10px; background: var(--teal); color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Clinic<span>Book</span> <span style="color:#9CA3AF;font-size:12px;">PRO</span></div>

    <div id="loadingState">
      <div class="spinner"></div>
      <div class="status-title">Confirming your account...</div>
      <div class="status-text">Please wait a moment while we finish setting things up.</div>
    </div>

    <div id="successState" style="display:none;">
      <div class="success-icon">&#9989;</div>
      <div class="status-title" id="successTitle">All set!</div>
      <div class="status-text" id="successText"></div>
      <a class="action-btn" href="staff-login.html">Go to Sign In</a>
    </div>

    <div id="errorState" style="display:none;">
      <div class="error-icon">&#9888;&#65039;</div>
      <div class="status-title">Something went wrong</div>
      <div class="status-text" id="errorText"></div>
      <a class="action-btn" href="signup.html">Back to Sign Up</a>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://iyxumauddvmdfbukrzaa.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eHVtYXVkZHZtZGZidWtyemFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDk5MTUsImV4cCI6MjA5ODIyNTkxNX0.5B2LHcgRdrRrJbrjKWbK-kqUUlHnws7nxl1fNeZrvHE';

    var headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    };

    function showError(msg) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorText').textContent = msg;
    }

    function showSuccess(title, text) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
      document.getElementById('successTitle').textContent = title;
      document.getElementById('successText').textContent = text;
    }

    // Supabase puts the access_token in the URL hash after email confirmation:
    // e.g. #access_token=...&refresh_token=...&type=signup
    function parseHashParams() {
      var hash = window.location.hash.substring(1);
      var params = {};
      hash.split('&').forEach(function(part) {
        var pair = part.split('=');
        if (pair[0]) params[pair[0]] = decodeURIComponent(pair[1] || '');
      });
      return params;
    }

    function getUserFromToken(accessToken) {
      return fetch(SUPABASE_URL + '/auth/v1/user', {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + accessToken }
      }).then(function(res) {
        if (!res.ok) throw new Error('Could not verify your account. Please try signing in directly.');
        return res.json();
      });
    }

    function createOrganization(authToken, name, type, phone) {
      var h = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
      return fetch(SUPABASE_URL + '/rest/v1/organizations', {
        method: 'POST', headers: h,
        body: JSON.stringify({ name: name, type: type, phone: phone })
      }).then(function(res) {
        if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || 'Failed to create organization'); });
        return res.json();
      }).then(function(data) { return data[0]; });
    }

    function createStaffRecord(authToken, userId, orgId, fullName, phone, role, specialty) {
      var h = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' };
      var body = { user_id: userId, org_id: orgId, role: role, full_name: fullName, phone: phone, is_active: true };
      if (specialty) body.specialty = specialty;
      return fetch(SUPABASE_URL + '/rest/v1/staff', {
        method: 'POST', headers: h, body: JSON.stringify(body)
      }).then(function(res) {
        if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || 'Failed to create staff record'); });
        return res.json();
      });
    }

    function createJoinRequest(authToken, userId, orgId, fullName, specialty, phone) {
      var h = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' };
      return fetch(SUPABASE_URL + '/rest/v1/join_requests', {
        method: 'POST', headers: h,
        body: JSON.stringify({ user_id: userId, org_id: orgId, full_name: fullName, specialty: specialty, phone: phone, status: 'pending' })
      }).then(function(res) {
        if (!res.ok) return res.json().then(function(e) { throw new Error(e.message || 'Failed to send join request'); });
        return res.json();
      });
    }

    function init() {
      var params = parseHashParams();
      var accessToken = params.access_token;

      if (!accessToken) {
        showError('No confirmation token found in this link. If you already confirmed your email, you can sign in directly.');
        return;
      }

      var pendingRaw = localStorage.getItem('clinicbook_pending_signup');
      if (!pendingRaw) {
        // Token is valid but we have no pending setup info (maybe opened on a different device/browser)
        showSuccess('Email confirmed!', 'Your email is confirmed. Please sign in \u2014 if this was a different device, ask whoever started the signup to check their original browser, or contact support to finish setup.');
        return;
      }

      var pending = JSON.parse(pendingRaw);

      getUserFromToken(accessToken).then(function(user) {
        var userId = user.id;

        if (pending.type === 'create_org') {
          return createOrganization(accessToken, pending.orgName, pending.orgType, pending.orgPhone).then(function(org) {
            return createStaffRecord(accessToken, userId, org.id, pending.fullName, pending.orgPhone, 'admin', null);
          }).then(function() {
            localStorage.removeItem('clinicbook_pending_signup');
            showSuccess('Organization created!', 'Your organization "' + pending.orgName + '" is ready. You can now sign in as the admin.');
          });
        } else if (pending.type === 'join_org') {
          return createJoinRequest(accessToken, userId, pending.orgId, pending.fullName, pending.specialty, pending.phone).then(function() {
            localStorage.removeItem('clinicbook_pending_signup');
            showSuccess('Request sent!', 'Your email is confirmed and your request to join "' + pending.orgName + '" has been sent. The admin will approve it shortly \u2014 you\'ll be able to sign in once approved.');
          });
        } else {
          showError('Unrecognized signup type. Please contact support.');
        }
      }).catch(function(err) {
        showError(err.message);
        console.error(err);
      });
    }

    init();
  </script>
</body>
</html>
