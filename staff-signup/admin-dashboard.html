<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClinicBook Pro — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAF9F5; --white: #fff; --navy: #1F2937;
      --teal: #059669; --teal-light: #ECFDF5;
      --text: #1A2636; --muted: #78716C;
      --border: #E7E5E0; --radius: 16px;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(31,29,23,0.06);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

    header {
      background: var(--navy); padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: #fff; letter-spacing: -0.5px; }
    .logo span { color: var(--teal); }
    .logout-btn {
      font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer;
      background: none; border: none; font-family: 'Inter', sans-serif;
      padding: 6px 12px; border-radius: 8px; transition: all 0.15s;
    }
    .logout-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }

    .welcome { background: var(--navy); padding: 20px 24px 28px; }
    .welcome-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; margin-bottom: 4px; }
    .welcome-sub { font-size: 13px; color: rgba(255,255,255,0.5); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px 24px 0; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px; text-align: center; box-shadow: var(--card-shadow); }
    .stat-num { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--navy); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .stat-card.pending .stat-num { color: #B45309; }

    .section { padding: 24px 24px 0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-family: 'DM Serif Display', serif; font-size: 19px; color: var(--text); }
    .section-action {
      font-size: 12px; font-weight: 600; color: var(--teal); cursor: pointer;
      background: none; border: none; font-family: 'Inter', sans-serif;
    }

    .empty-note { font-size: 13px; color: var(--muted); padding: 16px 0; text-align: center; }

    .invite-form {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--card-shadow);
      padding: 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px;
    }
    .invite-form input[type="email"] {
      flex: 2 1 180px; padding: 11px 13px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 14px; font-family: 'Inter', sans-serif; background: var(--bg); outline: none;
    }
    .invite-form input[type="email"]:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 3px rgba(5,150,105,.12); }
    .invite-form select {
      flex: 1 1 120px; padding: 11px 10px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 13px; font-family: 'Inter', sans-serif; background: var(--bg);
    }
    .invite-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--card-shadow);
      padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .invite-email { font-size: 14px; font-weight: 600; color: var(--text); }
    .invite-meta { font-size: 12px; color: var(--muted); margin-top: 1px; text-transform: capitalize; }

    .request-card {
      background: var(--white); border-radius: var(--radius); box-shadow: var(--card-shadow);
      padding: 16px; margin-bottom: 10px; border: 1px solid var(--border); border-left: 4px solid #D97706;
    }
    .request-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .request-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .request-specialty { font-size: 12px; color: var(--teal); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .request-phone { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .request-actions { display: flex; gap: 8px; }
    .req-btn {
      flex: 1; padding: 9px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.15s; background: var(--white);
    }
    .req-btn.approve { color: #047857; border-color: #A7F3D0; }
    .req-btn.approve:hover { background: #ECFDF5; }
    .req-btn.reject { color: #B91C1C; border-color: #FCA5A5; }
    .req-btn.reject:hover { background: #FEF2F2; }
    .req-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .role-select-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .role-select-row select {
      flex: 1; padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 13px; font-family: 'Inter', sans-serif; background: var(--bg);
    }

    .staff-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--card-shadow);
      padding: 14px 16px; margin-bottom: 8px;
    }
    .staff-card-top { display: flex; align-items: center; justify-content: space-between; }
    .staff-info { display: flex; align-items: center; gap: 12px; }
    .staff-avatar {
      width: 40px; height: 40px; border-radius: 10px; background: var(--teal-light);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--teal); flex-shrink: 0;
    }
    .staff-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .staff-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .staff-top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .role-pill {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 50px;
      text-transform: capitalize;
    }
    .role-pill.director { background: #E7E5E0; color: #1F2937; }
    .role-pill.admin { background: var(--teal-light); color: var(--teal); }
    .role-pill.doctor { background: #FEF3E2; color: #B45309; }
    .role-pill.receptionist { background: #F5F4F1; color: #57534E; }
    .staff-manage-btn {
      font-size: 11px; font-weight: 600; color: var(--teal); background: none;
      border: 1.5px solid var(--teal-light); border-radius: 50px; padding: 5px 11px;
      cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap;
    }
    .staff-manage-btn:hover { background: var(--teal-light); }
    .staff-manage-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .staff-manage-panel.open { display: block; }
    .staff-manage-row { margin-bottom: 10px; }
    .staff-manage-row label {
      display: block; font-size: 10.5px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px;
    }
    .staff-manage-row select {
      width: 100%; padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 13px; font-family: 'Inter', sans-serif; background: var(--bg);
    }
    .staff-manage-actions { display: flex; gap: 8px; margin-top: 12px; }
    .staff-save-btn {
      flex: 1; padding: 9px; border-radius: 8px; border: none; background: var(--teal);
      color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .staff-save-btn:hover { background: #047857; }
    .staff-toggle-active-btn {
      flex: 1; padding: 9px; border-radius: 8px; border: 1.5px solid #FCA5A5;
      background: var(--white); color: #B91C1C; font-size: 12.5px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .staff-toggle-active-btn.reactivate { border-color: #A7F3D0; color: #047857; }
    .staff-manage-btn:disabled, .staff-save-btn:disabled, .staff-toggle-active-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .staff-manage-error { font-size: 12px; color: #B91C1C; margin-top: 8px; display: none; }

    .add-dept-form {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--card-shadow);
      padding: 16px; margin-bottom: 14px; display: flex; gap: 8px;
    }
    .add-dept-form input {
      flex: 1; padding: 11px 13px; border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 14px; font-family: 'Inter', sans-serif; background: var(--bg); outline: none;
    }
    .add-dept-form input:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 3px rgba(5,150,105,.12); }
    .add-dept-btn {
      padding: 11px 18px; border-radius: 10px; border: none; background: var(--teal);
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .add-dept-btn:hover { background: #047857; }

    .dept-pill {
      display: inline-flex; align-items: center; gap: 6px; background: var(--white);
      border: 1.5px solid var(--border); border-radius: 50px; padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--text); margin: 0 8px 8px 0;
    }

    .skel { background: linear-gradient(90deg,#F2F1ED 25%,#F8F7F4 50%,#F2F1ED 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .error-box { margin: 16px 24px; padding: 14px 16px; background: #FEF2F2; border: 1.5px solid #FCA5A5; border-radius: 10px; font-size: 14px; color: #991B1B; display: none; }
    .toast { margin: 0 24px 14px; padding: 12px 14px; background: #ECFDF5; border: 1.5px solid #A7F3D0; border-radius: 10px; font-size: 13px; color: #047857; display: none; font-weight: 500; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid var(--border); display: flex; height: 64px; z-index: 999; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #78716C; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; border: none; background: none; cursor: pointer; padding: 8px 4px; position: relative; }
    .nav-badge { position: absolute; top: 3px; right: calc(50% - 26px); background: #B91C1C; color: #fff; font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 50px; display: flex; align-items: center; justify-content: center; padding: 0 3px; line-height: 1; }
    .nav-item img { width: 22px; height: 22px; }
    .nav-item.active { color: #059669; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Clinic<span>Book</span></div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </header>

  <div class="welcome">
    <div class="welcome-name" id="welcomeName">Loading...</div>
    <div class="welcome-sub" id="welcomeSub"></div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statStaff">&mdash;</div>
      <div class="stat-label">Staff</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statDepts">&mdash;</div>
      <div class="stat-label">Departments</div>
    </div>
    <div class="stat-card pending">
      <div class="stat-num" id="statPending">&mdash;</div>
      <div class="stat-label">Pending</div>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="toast" id="toast"></div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Invite Staff</div>
    </div>
    <div class="invite-form">
      <input type="email" id="inviteEmailInput" placeholder="staff@hospital.com" />
      <select id="inviteRoleSelect">
        <option value="director">Director</option>
        <option value="admin">Admin</option>
        <option value="receptionist">Receptionist</option>
        <option value="doctor" selected>Doctor</option>
      </select>
      <select id="inviteDeptSelect">
        <option value="">No department (solo)</option>
      </select>
      <button class="add-dept-btn" id="sendInviteBtn">Send invite</button>
    </div>
    <div id="invitesContainer">
      <div class="skel" style="height:60px;border-radius:12px;margin-bottom:8px;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Join Requests</div>
    </div>
    <div id="requestsContainer">
      <div class="skel" style="height:90px;border-radius:14px;margin-bottom:10px;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Departments</div>
    </div>
    <div class="add-dept-form">
      <input type="text" id="newDeptInput" placeholder="e.g. Dental, Pediatrics" />
      <button class="add-dept-btn" id="addDeptBtn">Add</button>
    </div>
    <div id="deptsContainer">
      <div class="skel" style="height:36px;width:120px;border-radius:50px;display:inline-block;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">All Staff</div>
    </div>
    <div id="staffContainer">
      <div class="skel" style="height:64px;border-radius:12px;margin-bottom:8px;"></div>
      <div class="skel" style="height:64px;border-radius:12px;margin-bottom:8px;"></div>
    </div>
  </div>

  <nav class="bottom-nav">

      <span>Dashboard</span>
    </a>

      <span>Front Desk</span>
    </a>

  <script src="session.js"></script>
  <script>
    var session = CB.requireSession();
    var authHeaders = CB.authHeaders;

    var myOrgId = null;
    var myStaffId = null;
    var myOrgName = '';

    function getLocalDateString() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    var today = getLocalDateString();

    function getInitials(name) {
      return (name || '').split(' ').filter(Boolean).slice(0, 2).map(function(n) { return n[0]; }).join('').toUpperCase();
    }

    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(function() { el.style.display = 'none'; }, 3000);
    }

    function showErrorBox(msg) {
      var el = document.getElementById('errorBox');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function fetchMyStaff() {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/staff?user_id=eq.' + session.user.id + '&select=id,full_name,role,org_id', {
        headers: authHeaders
      }).then(CB.safeJson).then(function(rows) {
        if (!rows.length || (rows[0].role !== 'admin' && rows[0].role !== 'director')) {
          throw new Error('You do not have admin access.');
        }
        return rows[0];
      });
    }

    function fetchOrg(orgId) {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/organizations?id=eq.' + orgId + '&select=id,name,type', {
        headers: authHeaders
      }).then(CB.safeJson).then(function(rows) { return rows[0]; });
    }

    function fetchJoinRequests(orgId) {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/join_requests?org_id=eq.' + orgId + '&status=eq.pending&select=id,user_id,full_name,specialty,phone,created_at&order=created_at.asc', {
        headers: authHeaders
      }).then(CB.safeJson);
    }

    function fetchDepartments(orgId) {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/departments?org_id=eq.' + orgId + '&select=id,name&order=name.asc', {
        headers: authHeaders
      }).then(CB.safeJson);
    }

    function fetchAllStaff(orgId) {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/staff?org_id=eq.' + orgId + '&select=id,full_name,role,specialty,phone,is_active,department_id&order=role.asc', {
        headers: authHeaders
      }).then(CB.safeJson);
    }

    function fetchPendingInvites(orgId) {
      return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/invites?org_id=eq.' + orgId + '&status=eq.pending&select=id,email,role,department_id,created_at&order=created_at.desc', {
        headers: authHeaders
      }).then(CB.safeJson);
    }

    function renderRequests(requests, departments) {
      var container = document.getElementById('requestsContainer');
      container.innerHTML = '';
      document.getElementById('statPending').textContent = requests.length;

      if (!requests.length) {
        container.innerHTML = '<div class="empty-note">No pending join requests.</div>';
        return;
      }

      requests.forEach(function(req) {
        var card = document.createElement('div');
        card.className = 'request-card';

        var top = document.createElement('div');
        top.className = 'request-top';
        var nameWrap = document.createElement('div');
        var name = document.createElement('div');
        name.className = 'request-name';
        name.textContent = req.full_name;
        var specialty = document.createElement('div');
        specialty.className = 'request-specialty';
        specialty.textContent = req.specialty || 'Doctor';
        nameWrap.appendChild(name);
        nameWrap.appendChild(specialty);
        top.appendChild(nameWrap);
        card.appendChild(top);

        var phone = document.createElement('div');
        phone.className = 'request-phone';
        phone.textContent = req.phone ? '\uD83D\uDCDE ' + req.phone : '';
        card.appendChild(phone);

        if (departments.length) {
          var deptRow = document.createElement('div');
          deptRow.className = 'role-select-row';
          var select = document.createElement('select');
          select.id = 'dept-select-' + req.id;
          var noneOpt = document.createElement('option');
          noneOpt.value = '';
          noneOpt.textContent = 'No department (solo)';
          select.appendChild(noneOpt);
          departments.forEach(function(d) {
            var opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name;
            select.appendChild(opt);
          });
          deptRow.appendChild(select);
          card.appendChild(deptRow);
        }

        var actions = document.createElement('div');
        actions.className = 'request-actions';

        var approveBtn = document.createElement('button');
        approveBtn.className = 'req-btn approve';
        approveBtn.textContent = 'Approve';
        approveBtn.addEventListener('click', function() {
          var deptSelect = document.getElementById('dept-select-' + req.id);
          var deptId = deptSelect ? deptSelect.value : null;
          approveRequest(req, deptId || null, card);
        });

        var rejectBtn = document.createElement('button');
        rejectBtn.className = 'req-btn reject';
        rejectBtn.textContent = 'Reject';
        rejectBtn.addEventListener('click', function() {
          if (confirm('Reject join request from ' + req.full_name + '?')) {
            rejectRequest(req, card);
          }
        });

        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        card.appendChild(actions);

        container.appendChild(card);
      });
    }

    function approveRequest(req, deptId, card) {
      var btns = card.querySelectorAll('.req-btn');
      btns.forEach(function(b) { b.disabled = true; });

      var staffBody = {
        user_id: req.user_id,
        org_id: myOrgId,
        department_id: deptId,
        role: 'doctor',
        full_name: req.full_name,
        specialty: req.specialty,
        phone: req.phone,
        is_active: true
      };

      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/staff', {
        method: 'POST', headers: authHeaders, body: JSON.stringify(staffBody)
      }).then(CB.safeJson).then(function() {
        return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/join_requests?id=eq.' + req.id, {
          method: 'PATCH', headers: authHeaders, body: JSON.stringify({ status: 'approved' })
        }).then(CB.safeJson);
      }).then(function() {
        showToast(req.full_name + ' approved and added as a doctor.');
        loadAll();
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox('Could not approve: ' + err.message);
        btns.forEach(function(b) { b.disabled = false; });
      });
    }

    function rejectRequest(req, card) {
      var btns = card.querySelectorAll('.req-btn');
      btns.forEach(function(b) { b.disabled = true; });

      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/join_requests?id=eq.' + req.id, {
        method: 'PATCH', headers: authHeaders, body: JSON.stringify({ status: 'rejected' })
      }).then(CB.safeJson).then(function() {
        showToast(req.full_name + '\'s request was rejected.');
        loadAll();
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox('Could not reject: ' + err.message);
        btns.forEach(function(b) { b.disabled = false; });
      });
    }

    function renderDepartments(departments) {
      var container = document.getElementById('deptsContainer');
      container.innerHTML = '';
      document.getElementById('statDepts').textContent = departments.length;

      if (!departments.length) {
        container.innerHTML = '<div class="empty-note">No departments yet. Add one above, or skip if you\'re a solo practice.</div>';
        return;
      }

      departments.forEach(function(d) {
        var pill = document.createElement('span');
        pill.className = 'dept-pill';
        pill.textContent = d.name;
        container.appendChild(pill);
      });
    }

    document.getElementById('addDeptBtn').addEventListener('click', function() {
      var input = document.getElementById('newDeptInput');
      var name = input.value.trim();
      if (!name) return;

      var btn = document.getElementById('addDeptBtn');
      btn.disabled = true;

      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/departments', {
        method: 'POST', headers: authHeaders,
        body: JSON.stringify({ org_id: myOrgId, name: name })
      }).then(CB.safeJson).then(function() {
        input.value = '';
        showToast('Department "' + name + '" added.');
        loadAll();
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox('Could not add department: ' + err.message);
      }).finally(function() {
        btn.disabled = false;
      });
    });

    function populateInviteDeptSelect(departments) {
      var select = document.getElementById('inviteDeptSelect');
      var current = select.value;
      select.innerHTML = '';
      var noneOpt = document.createElement('option');
      noneOpt.value = '';
      noneOpt.textContent = 'No department (solo)';
      select.appendChild(noneOpt);
      (departments || []).forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        select.appendChild(opt);
      });
      select.value = current;
    }

    function renderInvites(invites, departments) {
      var container = document.getElementById('invitesContainer');
      container.innerHTML = '';

      if (!invites.length) {
        container.innerHTML = '<div class="empty-note">No pending invites.</div>';
        return;
      }

      var deptMap = {};
      (departments || []).forEach(function(d) { deptMap[d.id] = d.name; });

      invites.forEach(function(inv) {
        var card = document.createElement('div');
        card.className = 'invite-card';

        var info = document.createElement('div');
        var email = document.createElement('div');
        email.className = 'invite-email';
        email.textContent = inv.email;
        var meta = document.createElement('div');
        meta.className = 'invite-meta';
        var bits = [inv.department_id ? deptMap[inv.department_id] : null, 'Invited ' + new Date(inv.created_at).toLocaleDateString()].filter(Boolean);
        meta.textContent = bits.join(' · ');
        info.appendChild(email);
        info.appendChild(meta);

        var right = document.createElement('div');
        right.className = 'staff-top-right';
        var pill = document.createElement('span');
        pill.className = 'role-pill ' + inv.role;
        pill.textContent = inv.role;
        var revokeBtn = document.createElement('button');
        revokeBtn.className = 'req-btn reject';
        revokeBtn.style.flex = 'none';
        revokeBtn.textContent = 'Revoke';
        revokeBtn.addEventListener('click', function() {
          if (confirm('Revoke invite to ' + inv.email + '?')) revokeInvite(inv.id, revokeBtn);
        });
        right.appendChild(pill);
        right.appendChild(revokeBtn);

        card.appendChild(info);
        card.appendChild(right);
        container.appendChild(card);
      });
    }

    function revokeInvite(inviteId, btn) {
      btn.disabled = true;
      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/invites?id=eq.' + inviteId, {
        method: 'PATCH', headers: authHeaders, body: JSON.stringify({ status: 'revoked' })
      }).then(CB.safeJson).then(function() {
        showToast('Invite revoked.');
        loadAll();
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox('Could not revoke invite: ' + err.message);
        btn.disabled = false;
      });
    }

    document.getElementById('sendInviteBtn').addEventListener('click', function() {
      var emailInput = document.getElementById('inviteEmailInput');
      var roleSelect = document.getElementById('inviteRoleSelect');
      var deptSelect = document.getElementById('inviteDeptSelect');
      var email = emailInput.value.trim();
      if (!email) return;

      var btn = document.getElementById('sendInviteBtn');
      btn.disabled = true;

      var chosenRole = roleSelect.value;
      // return=representation so we get the generated token back and can
      // hand it straight to send-invite-email — no second lookup needed.
      var insertHeaders = Object.assign({}, authHeaders, { 'Prefer': 'return=representation' });

      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/invites', {
        method: 'POST', headers: insertHeaders,
        body: JSON.stringify({
          org_id: myOrgId,
          email: email,
          role: chosenRole,
          department_id: deptSelect.value || null,
          invited_by: myStaffId,
          status: 'pending'
        })
      }).then(CB.safeJson).then(function(rows) {
        var newInvite = rows && rows[0];
        emailInput.value = '';
        loadAll();

        if (!newInvite || !newInvite.token) {
          showToast('Invite created, but no token came back — email not sent.');
          return;
        }

        return CB.authedFetch(CB.SUPABASE_URL + '/functions/v1/send-invite-email', {
          method: 'POST', headers: authHeaders,
          body: JSON.stringify({ email: email, token: newInvite.token, role: chosenRole })
        }).then(CB.safeJson).then(function() {
          showToast('Invite sent to ' + email + '.');
        }).catch(function(err) {
          if (err.message === 'SESSION_EXPIRED') return;
          showToast('Invite saved, but the email failed to send: ' + err.message);
        });
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox('Could not send invite: ' + err.message);
      }).finally(function() {
        btn.disabled = false;
      });
    });

    function renderStaff(staffList, departments) {
      var container = document.getElementById('staffContainer');
      container.innerHTML = '';
      document.getElementById('statStaff').textContent = staffList.length;

      if (!staffList.length) {
        container.innerHTML = '<div class="empty-note">No staff yet.</div>';
        return;
      }

      var deptMap = {};
      (departments || []).forEach(function(d) { deptMap[d.id] = d.name; });

      staffList.forEach(function(s) {
        var card = document.createElement('div');
        card.className = 'staff-card';

        // ---- top row: avatar/name/meta + role pill + manage toggle ----
        var top = document.createElement('div');
        top.className = 'staff-card-top';

        var info = document.createElement('div');
        info.className = 'staff-info';

        var avatar = document.createElement('div');
        avatar.className = 'staff-avatar';
        avatar.textContent = getInitials(s.full_name);

        var textWrap = document.createElement('div');
        var name = document.createElement('div');
        name.className = 'staff-name';
        name.textContent = s.full_name + (s.is_active ? '' : ' (inactive)');
        var meta = document.createElement('div');
        meta.className = 'staff-meta';
        var metaBits = [s.specialty, s.phone, s.department_id ? deptMap[s.department_id] : null].filter(Boolean);
        meta.textContent = metaBits.join(' · ');
        textWrap.appendChild(name);
        textWrap.appendChild(meta);

        info.appendChild(avatar);
        info.appendChild(textWrap);

        var topRight = document.createElement('div');
        topRight.className = 'staff-top-right';
        var pill = document.createElement('span');
        pill.className = 'role-pill ' + s.role;
        pill.textContent = s.role;
        var manageBtn = document.createElement('button');
        manageBtn.className = 'staff-manage-btn';
        manageBtn.textContent = 'Manage';
        topRight.appendChild(pill);
        topRight.appendChild(manageBtn);

        top.appendChild(info);
        top.appendChild(topRight);
        card.appendChild(top);

        // ---- expandable manage panel: role, department, active toggle ----
        var panel = document.createElement('div');
        panel.className = 'staff-manage-panel';

        var roleRow = document.createElement('div');
        roleRow.className = 'staff-manage-row';
        var roleLabel = document.createElement('label');
        roleLabel.textContent = 'Role';
        var roleSelect = document.createElement('select');
        ['director', 'admin', 'doctor', 'receptionist'].forEach(function(r) {
          var opt = document.createElement('option');
          opt.value = r;
          opt.textContent = r.charAt(0).toUpperCase() + r.slice(1);
          if (r === s.role) opt.selected = true;
          roleSelect.appendChild(opt);
        });
        roleRow.appendChild(roleLabel);
        roleRow.appendChild(roleSelect);

        var deptRow = document.createElement('div');
        deptRow.className = 'staff-manage-row';
        var deptLabel = document.createElement('label');
        deptLabel.textContent = 'Department';
        var deptSelect = document.createElement('select');
        var noneOpt = document.createElement('option');
        noneOpt.value = '';
        noneOpt.textContent = 'No department (solo)';
        if (!s.department_id) noneOpt.selected = true;
        deptSelect.appendChild(noneOpt);
        (departments || []).forEach(function(d) {
          var opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.name;
          if (d.id === s.department_id) opt.selected = true;
          deptSelect.appendChild(opt);
        });
        deptRow.appendChild(deptLabel);
        deptRow.appendChild(deptSelect);

        panel.appendChild(roleRow);
        panel.appendChild(deptRow);

        var errBox = document.createElement('div');
        errBox.className = 'staff-manage-error';
        panel.appendChild(errBox);

        var actions = document.createElement('div');
        actions.className = 'staff-manage-actions';

        var saveBtn = document.createElement('button');
        saveBtn.className = 'staff-save-btn';
        saveBtn.textContent = 'Save changes';
        saveBtn.addEventListener('click', function() {
          updateStaffMember(s.id, {
            role: roleSelect.value,
            department_id: deptSelect.value || null
          }, [saveBtn, toggleActiveBtn], errBox);
        });

        var toggleActiveBtn = document.createElement('button');
        toggleActiveBtn.className = 'staff-toggle-active-btn' + (s.is_active ? '' : ' reactivate');
        toggleActiveBtn.textContent = s.is_active ? 'Deactivate' : 'Reactivate';
        toggleActiveBtn.addEventListener('click', function() {
          var msg = s.is_active
            ? 'Deactivate ' + s.full_name + '? They will lose access immediately.'
            : 'Reactivate ' + s.full_name + '?';
          if (!confirm(msg)) return;
          updateStaffMember(s.id, { is_active: !s.is_active }, [saveBtn, toggleActiveBtn], errBox);
        });

        if (s.id === myStaffId) {
          roleSelect.disabled = true;
          toggleActiveBtn.disabled = true;
          toggleActiveBtn.title = "You can't change your own role or deactivate yourself.";
          roleSelect.title = "You can't change your own role or deactivate yourself.";
        }

        actions.appendChild(saveBtn);
        actions.appendChild(toggleActiveBtn);
        panel.appendChild(actions);

        card.appendChild(panel);

        manageBtn.addEventListener('click', function() {
          panel.classList.toggle('open');
        });

        container.appendChild(card);
      });
    }

    function updateStaffMember(staffId, updates, btns, errBox) {
      btns.forEach(function(b) { b.disabled = true; });
      errBox.style.display = 'none';

      CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/staff?id=eq.' + staffId, {
        method: 'PATCH', headers: authHeaders, body: JSON.stringify(updates)
      }).then(CB.safeJson).then(function() {
        showToast('Staff member updated.');
        loadAll();
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btns.forEach(function(b) { b.disabled = false; });
      });
    }

    function loadAll() {
      Promise.all([
        fetchJoinRequests(myOrgId),
        fetchDepartments(myOrgId),
        fetchAllStaff(myOrgId),
        fetchPendingInvites(myOrgId)
      ]).then(function(results) {
        var requests = results[0], departments = results[1], staffList = results[2], invites = results[3];
        renderRequests(requests, departments);
        renderDepartments(departments);
        renderStaff(staffList, departments);
        renderInvites(invites, departments);
        populateInviteDeptSelect(departments);
      }).catch(function(err) {
        if (err.message === 'SESSION_EXPIRED') return;
        showErrorBox(err.message);
        console.error(err);
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', function() { CB.logout(); });

    if (session) {
      fetchMyStaff().then(function(staff) {
        myOrgId = staff.org_id;
        myStaffId = staff.id;
        document.getElementById('welcomeName').textContent = 'Welcome, ' + staff.full_name;
        return fetchOrg(myOrgId);
      }).then(function(org) {
        myOrgName = org.name;
        document.getElementById('welcomeSub').textContent = org.name + ' \u2014 ' + org.type;
        loadAll();
        CB.fetchFrontDeskBadgeCount(myOrgId).then(function(count) { CB.setNavBadge('frontdesk', count); });
        CB.fetchActivityBadgeCount(myOrgId, today).then(function(count) { CB.setNavBadge('activity', count); });
      }).catch(function(err) {
        if (err.message !== 'SESSION_EXPIRED') {
          showErrorBox(err.message);
          console.error(err);
        }
      });
    }
  </script>
</body>
</html>
