<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClinicBook Pro — Daily Activity</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F9FB; --white: #fff; --navy: #0D1B2A;
      --teal: #0A7EA4; --teal-light: #E6F4F9;
      --text: #1A2636; --muted: #6B7A8D;
      --border: #DDE3EA; --radius: 14px;
      --card-shadow: 0 2px 12px rgba(13,27,42,0.07);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

    header {
      background: var(--navy); padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: #fff; letter-spacing: -0.5px; }
    .logo span { color: var(--teal); }
    .logout-btn {
      font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer;
      background: none; border: none; font-family: 'Inter', sans-serif;
      padding: 6px 12px; border-radius: 8px; transition: all 0.15s;
    }
    .logout-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }

    .welcome { background: var(--navy); padding: 20px 24px 28px; display: flex; align-items: flex-start; justify-content: space-between; }
    .welcome-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; margin-bottom: 4px; }
    .welcome-sub { font-size: 13px; color: rgba(255,255,255,0.5); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px 24px 0; }
    .stat-card { background: var(--white); border-radius: 12px; padding: 14px 12px; text-align: center; box-shadow: var(--card-shadow); }
    .stat-num { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--navy); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .stat-card.amber .stat-num { color: #D97706; }
    .stat-card.green .stat-num { color: #16A34A; }
    .stat-card.red .stat-num { color: #DC2626; }

    .section { padding: 20px 24px 0; }

    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .date-input { font-size: 13px; border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 11px; background: var(--white); font-family: 'Inter', sans-serif; }
    .today-btn { appearance: none; border: 1.5px solid var(--teal); background: var(--teal-light); color: var(--teal); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .followup-toggle {
      appearance: none; border: 1.5px solid var(--border); background: var(--white);
      border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; color: var(--muted); margin-left: auto;
    }
    .followup-toggle.on { border-color: #DC2626; background: #FEE2E2; color: #991B1B; }

    .dept-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 16px 24px 0; }
    .dept-tab {
      flex-shrink: 0; padding: 7px 14px; border-radius: 50px; font-size: 12.5px; font-weight: 600;
      border: 1.5px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer;
      font-family: 'Inter', sans-serif; white-space: nowrap;
    }
    .dept-tab.active { background: var(--navy); border-color: var(--navy); color: #fff; }

    .activity-card {
      background: var(--white); border-radius: 12px; box-shadow: var(--card-shadow);
      padding: 14px 16px; margin-bottom: 8px; border-left: 4px solid var(--border);
    }
    .activity-card.booked { border-left-color: #16A34A; }
    .activity-card.cancelled { border-left-color: #DC2626; }
    .activity-card.waitlisted { border-left-color: #D97706; }
    .activity-card.escalated { border-left-color: #DC2626; }
    .activity-card.chatted_only { border-left-color: var(--border); }

    .activity-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .activity-name { font-size: 14px; font-weight: 600; }
    .activity-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .activity-summary { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.4; }
    .activity-summary.pending { color: var(--muted); font-style: italic; }

    .badge-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
    .mini-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.03em; }
    .mini-badge.booked { background: #DCFCE7; color: #16A34A; }
    .mini-badge.cancelled { background: #FEE2E2; color: #DC2626; }
    .mini-badge.waitlisted { background: #FEF3C7; color: #D97706; }
    .mini-badge.escalated { background: #FEE2E2; color: #DC2626; }
    .mini-badge.chatted_only { background: #EEF2F6; color: var(--muted); }
    .mini-badge.followup { background: #FEE2E2; color: #991B1B; }
    .mini-badge.paused { background: #FEF3C7; color: #D97706; }

    .ai-summary-btn {
      appearance: none; border: 1.5px solid var(--teal); background: var(--teal-light); color: var(--teal);
      border-radius: 50px; padding: 4px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; margin-left: auto;
    }
    .ai-summary-btn:disabled { opacity: 0.6; cursor: default; }

    .skel { background: linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .empty { text-align: center; padding: 30px 0; }
    .empty p { font-size: 13px; color: var(--muted); }

    .error-box { margin: 16px 24px; padding: 14px 16px; background: #FEE2E2; border: 1.5px solid #FCA5A5; border-radius: 10px; font-size: 14px; color: #991B1B; display: none; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 2px solid #DDE3EA; display: flex; height: 64px; z-index: 999; box-shadow: 0 -2px 12px rgba(0,0,0,0.08); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B7A8D; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; border: none; background: none; cursor: pointer; padding: 8px 4px; position: relative; }
    .nav-badge { position: absolute; top: 3px; right: calc(50% - 26px); background: #DC2626; color: #fff; font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 50px; display: flex; align-items: center; justify-content: center; padding: 0 3px; line-height: 1; }
    .nav-item img { width: 22px; height: 22px; }
    .nav-item.active { color: #0A7EA4; }

    #access-denied {
      display: none; min-height: 100vh; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; padding: 24px; text-align: center;
    }
    #access-denied p { color: var(--muted); font-size: 14px; max-width: 320px; }
    #access-denied a {
      display: inline-block; background: var(--teal); color: #fff; text-decoration: none;
      padding: 10px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    }
  </style>
</head>
<body>

<div id="access-denied">
  <div class="logo" style="color:var(--navy);">Clinic<span style="color:var(--teal);">Book</span></div>
  <p id="access-denied-msg">Checking your access…</p>
  <a href="#" id="access-denied-link" style="display:none;">Go to my dashboard</a>
</div>

<div id="app-shell" style="display:none;">

  <header>
    <div class="logo">Clinic<span>Book</span></div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </header>

  <div class="welcome">
    <div>
      <div class="welcome-name">Daily Activity</div>
      <div class="welcome-sub" id="welcomeSub">Loading…</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTotal">&mdash;</div><div class="stat-label">Conversations</div></div>
    <div class="stat-card green"><div class="stat-num" id="statBooked">&mdash;</div><div class="stat-label">Booked</div></div>
    <div class="stat-card red"><div class="stat-num" id="statFollowup">&mdash;</div><div class="stat-label">Needs Follow-up</div></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="section">
    <div class="toolbar">
      <input type="date" id="activityDate" class="date-input" />
      <button class="today-btn" id="todayBtn">Today</button>
      <button class="followup-toggle" id="followupToggle">Needs follow-up only</button>
    </div>
  </div>

  <div class="dept-tabs" id="deptTabs">
    <button class="dept-tab active" data-dept="all">All departments</button>
  </div>

  <div class="section">
    <div id="activityContainer" style="margin-top:14px;">
      <div class="skel" style="height:70px;border-radius:12px;margin-bottom:8px;"></div>
      <div class="skel" style="height:70px;border-radius:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

</div>

<script src="session.js"></script>
<script>
  var session = CB.requireSession();
  var authHeaders = CB.authHeaders;

  var myStaffId = null;
  var myOrgId = null;
  var myRole = null;
  var activityCache = [];
  var activeDept = 'all';
  var followupOnly = false;

  function getLocalDateString() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  var today = getLocalDateString();

  function timeAgo(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var h = d.getHours(); var m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  }

  function dashboardUrlForRole(role) { return CB.dashboardUrlForRole(role); }

  // ---------------------------------------------------------------------
  // ACCESS GATE
  // ASSUMPTION: this is an oversight/analytics view, so only admins and
  // receptionists get in (mirrors front-desk.html's org-facing pages).
  // Doctors are redirected to their own dashboard. Tell me if doctors
  // should have access too and I'll open this up.
  // ---------------------------------------------------------------------
  function checkAccess() {
    return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/staff?user_id=eq.' + session.user.id + '&select=id,full_name,role,org_id,is_active', {
      headers: authHeaders
    }).then(CB.safeJson).then(function(rows) {
      if (!rows.length) throw new Error('NO_STAFF_RECORD');
      var me = rows[0];

      if (!me.is_active) throw new Error('DEACTIVATED');

      myStaffId = me.id;
      myOrgId = me.org_id;
      myRole = me.role;

      if (me.role === 'admin' || me.role === 'receptionist') {
        return me;
      }

      throw new Error('DOCTOR_NO_ACCESS');
    }).then(function(me) {
      CB.renderBottomNav(me.role, 'activity');
      document.getElementById('welcomeSub').textContent =
        me.full_name + ' — ' + (me.role.charAt(0).toUpperCase() + me.role.slice(1));
      document.getElementById('app-shell').style.display = 'block';
      return true;
    }).catch(function(err) {
      if (err.message === 'DOCTOR_NO_ACCESS') {
        CB.showDenied('This view is for front desk staff and admins.', 'doctor-dashboard.html');
      } else if (err.message === 'DEACTIVATED') {
        CB.showDenied('Your account has been deactivated. Please contact your organization admin.', null);
      } else if (err.message === 'NO_STAFF_RECORD') {
        CB.showDenied('Could not verify your staff account. Please sign in again.', null);
        localStorage.removeItem('clinicbook_pro_session');
      } else if (err.message !== 'SESSION_EXPIRED') {
        CB.showDenied('Could not verify your access. Please sign in again.', null);
      }
      return false;
    });
  }

  // ---------------------------------------------------------------------
  // DATA
  // Calls the get_daily_activity(p_org_id, p_date) RPC.
  // ---------------------------------------------------------------------
  function fetchDailyActivity(dateStr) {
    return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/rpc/get_daily_activity', {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify({ p_org_id: myOrgId, p_date: dateStr })
    }).then(CB.safeJson);
  }

  function fetchDeptNames(deptIds) {
    if (!deptIds.length) return Promise.resolve([]);
    return CB.authedFetch(CB.SUPABASE_URL + '/rest/v1/departments?id=in.(' + deptIds.join(',') + ')&select=id,name', {
      headers: authHeaders
    }).then(CB.safeJson).catch(function() { return []; }); // table may not exist yet — fail soft
  }

  var deptNameMap = {};

  function renderDeptTabs() {
    var present = Array.from(new Set(activityCache.map(function(a) { return a.department_id || 'unrouted'; })));
    var tabsEl = document.getElementById('deptTabs');
    tabsEl.innerHTML = '';

    var allTab = document.createElement('button');
    allTab.className = 'dept-tab' + (activeDept === 'all' ? ' active' : '');
    allTab.textContent = 'All departments';
    allTab.addEventListener('click', function() { activeDept = 'all'; renderDeptTabs(); renderActivity(); });
    tabsEl.appendChild(allTab);

    present.forEach(function(deptId) {
      var label = deptId === 'unrouted' ? 'Unrouted' : (deptNameMap[deptId] || 'Department');
      var tab = document.createElement('button');
      tab.className = 'dept-tab' + (activeDept === deptId ? ' active' : '');
      tab.textContent = label;
      tab.addEventListener('click', function() { activeDept = deptId; renderDeptTabs(); renderActivity(); });
      tabsEl.appendChild(tab);
    });
  }

  function renderStats() {
    document.getElementById('statTotal').textContent = activityCache.length;
    document.getElementById('statBooked').textContent = activityCache.filter(function(a) { return a.activity_type === 'booked'; }).length;
    document.getElementById('statFollowup').textContent = activityCache.filter(function(a) { return a.needs_followup; }).length;
  }

  function renderActivity() {
    var container = document.getElementById('activityContainer');
    var rows = activityCache.filter(function(a) {
      var deptKey = a.department_id || 'unrouted';
      if (activeDept !== 'all' && deptKey !== activeDept) return false;
      if (followupOnly && !a.needs_followup) return false;
      return true;
    });

    if (!rows.length) {
      container.innerHTML = '<div class="empty"><p>No activity matches this view.</p></div>';
      return;
    }

    container.innerHTML = '';
    rows.forEach(function(a) {
      var card = document.createElement('div');
      card.className = 'activity-card ' + a.activity_type;

      var top = document.createElement('div');
      top.className = 'activity-top';
      var name = document.createElement('span');
      name.className = 'activity-name';
      name.textContent = a.patient_name || a.patient_phone;
      var time = document.createElement('span');
      time.className = 'activity-time';
      time.textContent = timeAgo(a.last_message_at);
      top.appendChild(name);
      top.appendChild(time);

      var summary = document.createElement('div');
      summary.className = 'activity-summary' + (a.activity_type === 'chatted_only' ? ' pending' : '');
      summary.textContent = a.summary;

      var badges = document.createElement('div');
      badges.className = 'badge-row';
      var typeBadge = document.createElement('span');
      typeBadge.className = 'mini-badge ' + a.activity_type;
      typeBadge.textContent = a.activity_type.replace('_', ' ');
      badges.appendChild(typeBadge);

      if (a.needs_followup) {
        var fb = document.createElement('span');
        fb.className = 'mini-badge followup';
        fb.textContent = 'Follow-up';
        badges.appendChild(fb);
      }
      if (a.ai_paused) {
        var pb = document.createElement('span');
        pb.className = 'mini-badge paused';
        pb.textContent = 'AI paused';
        badges.appendChild(pb);
      }

      // AI summary fallback — only offered for patients who just chatted,
      // since rule-based summaries already cover booked/cancelled/waitlisted/escalated.
      if (a.activity_type === 'chatted_only') {
        var aiBtn = document.createElement('button');
        aiBtn.className = 'ai-summary-btn';
        aiBtn.textContent = 'Get AI summary';
        aiBtn.addEventListener('click', function() { getAiSummary(a.patient_phone, aiBtn, summary); });
        badges.appendChild(aiBtn);
      }

      card.appendChild(top);
      card.appendChild(summary);
      card.appendChild(badges);
      container.appendChild(card);
    });
  }

  function getAiSummary(phone, btn, summaryEl) {
    btn.disabled = true;
    btn.textContent = 'Summarizing…';
    CB.authedFetch(CB.SUPABASE_URL + '/functions/v1/summarize-conversation', {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify({ org_id: myOrgId, patient_phone: phone })
    }).then(CB.safeJson).then(function(result) {
      summaryEl.textContent = (result && result.summary) ? result.summary : 'No summary returned.';
      summaryEl.classList.remove('pending');
      btn.remove();
    }).catch(function(err) {
      if (err.message === 'SESSION_EXPIRED') return; // already redirecting to login
      btn.disabled = false;
      btn.textContent = 'Retry AI summary';
      showErrorBox('AI summary failed: ' + err.message);
    });
  }

  function loadActivity(dateStr) {
    var container = document.getElementById('activityContainer');
    container.innerHTML = '<div class="skel" style="height:70px;border-radius:12px;margin-bottom:8px;"></div><div class="skel" style="height:70px;border-radius:12px;"></div>';

    return fetchDailyActivity(dateStr).then(function(rows) {
      activityCache = rows || [];
      var deptIds = Array.from(new Set(activityCache.filter(function(a) { return a.department_id; }).map(function(a) { return a.department_id; })));
      var followupCount = activityCache.filter(function(a) { return a.needs_followup; }).length;
      CB.setNavBadge('activity', followupCount);
      return fetchDeptNames(deptIds).then(function(depts) {
        deptNameMap = {};
        (depts || []).forEach(function(d) { deptNameMap[d.id] = d.name; });
        renderStats();
        renderDeptTabs();
        renderActivity();
      });
    }).catch(function(err) {
      if (err.message === 'SESSION_EXPIRED') return;
      showErrorBox(err.message);
    });
  }

  document.getElementById('activityDate').value = today;
  document.getElementById('activityDate').addEventListener('change', function() { loadActivity(this.value); });
  document.getElementById('todayBtn').addEventListener('click', function() {
    document.getElementById('activityDate').value = today;
    loadActivity(today);
  });
  document.getElementById('followupToggle').addEventListener('click', function() {
    followupOnly = !followupOnly;
    this.classList.toggle('on', followupOnly);
    renderActivity();
  });

  document.getElementById('logoutBtn').addEventListener('click', function() { CB.logout(); });

  function showErrorBox(msg) {
    var el = document.getElementById('errorBox');
    el.textContent = msg; el.style.display = 'block';
  }

  // ---------------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------------
  if (session) {
    checkAccess().then(function(allowed) {
      if (!allowed) return;
      loadActivity(today);
      CB.fetchFrontDeskBadgeCount(myOrgId).then(function(count) { CB.setNavBadge('frontdesk', count); });
    });
  }
</script>

</body>
</html>
